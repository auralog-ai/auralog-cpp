name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang-format libcurl4-openssl-dev

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          find include src tests examples \( -name '*.hpp' -o -name '*.cpp' \) -print \
            | xargs clang-format --dry-run --Werror

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizer:
    name: sanitizer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Configure
        run: cmake -S . -B build-sanitizer -DCMAKE_BUILD_TYPE=Debug -DAURALOG_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-sanitizer --parallel

      - name: Test
        run: ctest --test-dir build-sanitizer --output-on-failure

  tsan:
    name: tsan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Configure
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DAURALOG_ENABLE_TSAN=ON

      - name: Build
        run: cmake --build build-tsan --parallel

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build-tsan --output-on-failure

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: lukka/get-cmake@latest

      - name: Install vcpkg dependencies
        run: vcpkg install curl:x64-windows

      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
